name: Build JARVIS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o jarvis-ai-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk JARVIS-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: JARVIS-AI.apk
      - name: Publish APK as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JARVIS AI APK ${{ github.run_number }}
          files: JARVIS-AI.apk
